# Sunucu: Java API ve kendi PostgreSQL'i.
#
#   cd /srv/olivamore/dev/olive_api_java/deploy
#   cp .env.server.example .env                              # bir kez; degerleri doldur
#   ./deploy.sh                                              # cek + derle + baslat + saglik kontrolu
#   docker compose -f compose.server.yaml run --rm api --seed  # bos veritabanina demo veri (bir kez)
#
# Veritabani disariya acilmaz; yalnizca API konteyneri baglanir.
name: ${COMPOSE_PROJECT_NAME:?.env icinde COMPOSE_PROJECT_NAME tanimli olmali}

services:
  db:
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?.env icinde DB_DATABASE tanimli olmali}
      POSTGRES_USER: ${DB_USERNAME:?.env icinde DB_USERNAME tanimli olmali}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env icinde DB_PASSWORD tanimli olmali}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ..
    image: ${COMPOSE_PROJECT_NAME}-api
    container_name: ${COMPOSE_PROJECT_NAME}-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8001}:8081"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # Konteynerde compose dosyasi yok: Spring Boot'un docker compose destegi kapali
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      # Uygulama surumleri (APK) bu klasorden sunulur
      APP_RELEASES_PATH: /data/app
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=50}
    volumes:
      - ${RELEASES_DIR:-./releases}:/data/app:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  db-data:
