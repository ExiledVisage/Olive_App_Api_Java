# Gelistirme ortami (tek basina, Laravel gerekmez).
#
# Java uygulamasi bilgisayarda calisir (./mvnw spring-boot:run ya da IDE). Acilirken
# spring-boot-docker-compose bu dosyayi otomatik baslatir (start-only: kapaninca durdurmaz).
#
# Veritabani iki sekilde olabilir (.env.example'a bakin):
#   - Bilgisayara kurulu PostgreSQL (varsayilan): .env'deki DB_* ile baglanilir
#   - Docker'daki PostgreSQL: .env'de COMPOSE_PROFILES=docker-db. Spring Boot konteyneri
#     bulup baglantiyi kendisi kurar, DB_* ayarlarina gerek kalmaz
#
#   http://localhost:8081   Java uygulamasi
#   http://localhost:8025   Mailpit (gelen mailler)
#   http://localhost:9090   Prometheus
#   http://localhost:3000   Grafana (admin / admin)
#
# Gecis doneminde Laravel ile birlikte calisma: compose.laravel.yaml

name: olive-java

services:
  postgres:
    profiles: [docker-db]
    # Canli sistemle ayni surum
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-oliveapp}
      POSTGRES_USER: ${DB_USERNAME:-oliveapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oliveapp}
    # Rastgele port, yalnizca bu bilgisayardan (127.0.0.1): bilgisayarda kurulu bir
    # PostgreSQL 5432'yi kullaniyor olabilir. Spring Boot gercek portu kendisi bulur.
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"   # arayuz
      - "1025:1025"   # SMTP
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

  # Java uygulamasi konteynerde (istege bagli):  docker compose --profile container up -d --build
  # Veritabani: bilgisayardaki PostgreSQL (host.docker.internal) ya da DB_HOST=postgres (docker-db)
  api:
    profiles: [container]
    build: .
    environment:
      DB_HOST: ${DB_HOST_FROM_CONTAINER:-host.docker.internal}
      DB_PORT: ${DB_PORT_FROM_CONTAINER:-5432}
      DB_DATABASE: ${DB_DATABASE:-oliveapp}
      DB_USERNAME: ${DB_USERNAME:-oliveapp}
      DB_PASSWORD: ${DB_PASSWORD:-oliveapp}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
