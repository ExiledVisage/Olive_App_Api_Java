# Gelistirme ortami: Laravel ile yan yana calisma (Strangler Fig).
#
# On kosul: Laravel ayakta olmali, cunku bu servisler onun Docker agina katilir:
#   cd ../Olive_Production_Tracking_App_Back/olive_oil_back && docker compose up -d
#
# Java uygulamasi bilgisayarda calisir (./mvnw spring-boot:run ya da IDE). Acilirken
# spring-boot-docker-compose bu dosyayi otomatik baslatir (start-only: kapaninca durdurmaz).
#
#   http://localhost:8080   reverse proxy: frontend buraya baglanir
#   http://localhost:8081   Java uygulamasi (dogrudan)
#   http://localhost:8001   Laravel (dogrudan, kendi compose'u)
#   http://localhost:8025   Mailpit (gelen mailler)
#   http://localhost:9090   Prometheus
#   http://localhost:3000   Grafana (admin / admin)
#
# Java'yi da konteynerde calistirmak icin:  docker compose --profile container up -d --build
# (proxy'nin Java hedefi .env'de JAVA_UPSTREAM=api:8081 yapilmali)

name: olive-java

services:
  # Laravel'in Postgres'ine kopru. Laravel compose'u veritabani portunu bilerek
  # disari acmiyor; Laravel reposuna dokunmamak icin port burada, yalnizca bu
  # bilgisayara (127.0.0.1) acilir. Java ve Laravel ayni veritabanini kullanir.
  db-bridge:
    image: alpine/socat:1.8.0.3
    command: TCP-LISTEN:5432,fork,reuseaddr TCP:db:5432
    networks: [laravel]
    ports:
      - "127.0.0.1:${DB_BRIDGE_PORT:-5433}:5432"
    restart: unless-stopped

  # Frontend'in bagladigi tek adres. Tasinan modullerin yollari Java'ya,
  # geri kalan her sey Laravel'e gider. Yonlendirmeler: docker/proxy/java-routes.caddy
  proxy:
    image: caddy:2.10-alpine
    ports:
      - "${PROXY_PORT:-8080}:80"
    environment:
      LARAVEL_UPSTREAM: ${LARAVEL_UPSTREAM:-olivamore-dev-api:8080}
      JAVA_UPSTREAM: ${JAVA_UPSTREAM:-host.docker.internal:8081}
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/proxy/java-routes.caddy:/etc/caddy/java-routes.caddy:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [laravel, default]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"   # arayuz
      - "1025:1025"   # SMTP
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

  # Java uygulamasi konteynerde (istege bagli). Varsayilan gelistirmede kullanilmaz.
  api:
    profiles: [container]
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-olivamore}
      DB_USERNAME: ${DB_USERNAME:-olivamore}
      DB_PASSWORD: ${DB_PASSWORD:?.env icinde DB_PASSWORD tanimli olmali}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "8081:8081"
    networks: [laravel, default]

networks:
  # Laravel'in compose'unun agi (COMPOSE_PROJECT_NAME=olivamore-dev)
  laravel:
    name: ${LARAVEL_NETWORK:-olivamore-dev_default}
    external: true

volumes:
  prometheus-data:
  grafana-data:
