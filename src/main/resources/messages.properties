# API mesajlari. {attribute} alanin okunur adiyla, digerleri kuralin degerleriyle doldurulur.
# Bean Validation anotasyonlari bu anahtarlari {validation.required} biciminde kullanir.

validation.required=The {attribute} field is required.
validation.string=The {attribute} field must be a string.
validation.integer=The {attribute} field must be an integer.
validation.numeric=The {attribute} field must be a number.
validation.boolean=The {attribute} field must be true or false.
validation.array=The {attribute} field must be an array.
validation.email=The {attribute} field must be a valid email address.
validation.date=The {attribute} field must be a valid date.
validation.date-format=The {attribute} field must match the format {format}.
validation.in=The selected {attribute} is invalid.
validation.exists=The selected {attribute} is invalid.
validation.unique=The {attribute} has already been taken.
validation.confirmed=The {attribute} field confirmation does not match.
validation.distinct=The {attribute} field has a duplicate value.
validation.size.min=The {attribute} field must be at least {min} characters.
validation.size.max=The {attribute} field must not be greater than {max} characters.
validation.items.min=The {attribute} field must have at least {min} items.
validation.min=The {attribute} field must be at least {value}.
validation.max=The {attribute} field must not be greater than {value}.
validation.gt=The {attribute} field must be greater than {value}.
validation.between.90=The {attribute} field must be between -90 and 90.
validation.between.180=The {attribute} field must be between -180 and 180.
validation.required-with.contents=The {attribute} field is required when contents is present.
validation.required-with.components=The {attribute} field is required when components is present.
validation.required-with.placements=The {attribute} field is required when placements is present.
validation.required-with=The {attribute} field is required when {other} is present.
validation.required-without=The {attribute} field is required when {other} is not present.
validation.required-without-all=The {attribute} field is required when none of {others} are present.
validation.prohibits=The {attribute} field prohibits {other} from being present.
validation.different=The {attribute} field and {other} must be different.
validation.after-or-equal=The {attribute} field must be a date after or equal to {other}.
validation.summary.more-one={message} (and 1 more error)
validation.summary.more={message} (and {count} more errors)
validation.summary.none=The given data was invalid.

error.not-found={resource} {id} not found.
error.route-not-found=The route {path} could not be found.
error.method-not-allowed=The {method} method is not supported for route {path}. Supported methods: {methods}.
error.malformed-json=Malformed JSON.
error.unsupported-media-type=Unsupported Media Type.
error.unauthenticated=Unauthenticated.
error.too-many-attempts=Too Many Attempts.
error.content-too-large=Payload Too Large.
error.server=Server Error
