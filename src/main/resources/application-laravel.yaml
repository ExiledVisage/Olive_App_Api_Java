# GECIS DONEMI: Laravel ile ayni veritabanini kullanma.
# ./mvnw spring-boot:run -Dspring-boot.run.profiles=laravel
# Laravel kapatildiginda (Faz 12) bu dosya ve compose.laravel.yaml silinir.
spring:
  datasource:
    # compose.laravel.yaml'daki db-bridge uzerinden Laravel'in PostgreSQL'i
    url: jdbc:postgresql://localhost:${LARAVEL_DB_BRIDGE_PORT:5433}/${LARAVEL_DB_DATABASE:olivamore}
    username: ${LARAVEL_DB_USERNAME:olivamore}
    # Laravel'in sifresi: ../Olive_Production_Tracking_App_Back/olive_oil_back/.env icindeki DB_PASSWORD
    password: ${LARAVEL_DB_PASSWORD:}

  docker:
    compose:
      file:
        - compose.yaml
        - compose.laravel.yaml
      # docker-db profili (.env'deki COMPOSE_PROFILES) burada acilmasin: Spring Boot onu bulup
      # baglantiyi Laravel yerine ona kurardi
      profiles:
        active: laravel-mode

olive:
  # Laravel'in surum klasoru (compose: ./docker-data -> /data, APP_RELEASES_PATH=/data/app)
  releases-path: ${LARAVEL_RELEASES_PATH:../Olive_Production_Tracking_App_Back/olive_oil_back/docker-data/app}
