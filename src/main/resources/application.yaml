spring:
  application:
    name: olive-api
  # Yerel sirlar (DB sifresi). Git'e girmez; sablon: .env.example
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true

  # Bilgisayardaki PostgreSQL (.env'deki DB_*). Docker'daki PostgreSQL kullaniliyorsa
  # (COMPOSE_PROFILES=docker-db) Spring Boot baglantiyi kendisi kurar ve bunu ezer.
  # Testlerde Testcontainers ezer.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:oliveapp}
    username: ${DB_USERNAME:oliveapp}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # Semayi Flyway kurar: Hibernate dokunmaz, sadece entity'lerin semaya uydugunu dogrular.
      ddl-auto: validate
    properties:
      # jsonb kolonlari Jackson 3 ile: classpath'te Jackson 2 de var (springdoc'un swagger-core'u),
      # Hibernate kendiliginden onu secer ve tools.jackson JsonNode'u okuyamaz
      hibernate.type.json_format_mapper: jackson3

  jackson:
    property-naming-strategy: SNAKE_CASE

  data:
    web:
      pageable:
        # ?page=0&size=20 (0 tabanli); sayfa parametresi yoksa butun kayitlar (WebConfig)
        max-page-size: 200
        serialization-mode: via-dto

  docker:
    compose:
      # compose.yaml'daki servisler uygulama kapaninca durmasin
      lifecycle-management: start-only
      start:
        # Bazi servisler zaten calisiyor olsa da "up" calissin: eksik olanlari baslatir,
        # calisanlara dokunmaz
        skip: never

server:
  port: 8081

# API dokumantasyonu (/v3/api-docs, /swagger-ui.html) varsayilan olarak kapali; yalnizca dev profilinde
# acilir (application-dev.yaml, ./mvnw spring-boot:run). Sunucuda profil yok, kapali kalir.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

olive:
  http:
    # Istek govdesi siniri; asan istek 413 alir
    max-request-body: ${MAX_REQUEST_BODY:2MB}
  security:
    jwt:
      # PKCS#8 PEM (tek satirda \n ile olabilir). Tanimli degilse uygulama baslamaz; bkz. .env.example
      private-key: ${JWT_PRIVATE_KEY:}
      key-id: ${JWT_KEY_ID:olive-1}
      issuer: ${JWT_ISSUER:olive-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
  # Giris-cikis ve mesai (docs/ATTENDANCE.md); QR imza anahtari verilmezse JWT anahtarindan turetilir
  attendance:
    zone: ${ATTENDANCE_ZONE:Europe/Istanbul}
    code-secret: ${ATTENDANCE_CODE_SECRET:${JWT_PRIVATE_KEY:}}
    code-ttl: ${ATTENDANCE_CODE_TTL:60s}
    rounding-minutes: ${ATTENDANCE_ROUNDING_MINUTES:15}
  # Site ve pazar yeri entegrasyonlari (docs/INTEGRATIONS.md); erisim bilgisi anahtari verilmezse JWT anahtarindan
  integration:
    secret: ${INTEGRATION_SECRET:${JWT_PRIVATE_KEY:}}
    # Yalniz https adreslere baglanilir; gelistirmede yerel sahte sunucu icin true yapilabilir
    allow-http: ${INTEGRATION_ALLOW_HTTP:false}
  # Mobil uygulama surumleri (version.json + APK); frontend'in yayinlama betigi buraya koyar
  releases-path: ${APP_RELEASES_PATH:releases}
  # Sisedeki QR'in actigi herkese acik sayfanin adres tabani (alan adi gelince degisir; QR'lar yeni adresle uretilir)
  public-base-url: ${PUBLIC_BASE_URL:http://161.35.54.96:8001}
