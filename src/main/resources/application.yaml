spring:
  application:
    name: olive-api
  # Yerel sirlar (DB sifresi). Git'e girmez; sablon: .env.example
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true

  # Bilgisayardaki PostgreSQL (.env'deki DB_*). Docker'daki PostgreSQL kullaniliyorsa
  # (COMPOSE_PROFILES=docker-db) Spring Boot baglantiyi kendisi kurar ve bunu ezer.
  # Laravel ile ortak veritabani: application-laravel.yaml. Testlerde Testcontainers ezer.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:oliveapp}
    username: ${DB_USERNAME:oliveapp}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # Sema Laravel'in: Hibernate dokunmaz, sadece entity'lerin semaya uydugunu dogrular.
      ddl-auto: validate

  flyway:
    # Bos veritabaninda Laravel'in migration'lari (db/migration, V0.00-V0.69) ve V2
    # calisir. Laravel'in olusturdugu mevcut bir veritabaninda (laravel profili, sunucu) sema
    # surum 1 olarak kabul edilir; V0.xx'ler bunun altinda kaldigi icin calismaz.
    baseline-on-migrate: true
    baseline-version: 1

  jackson:
    property-naming-strategy: SNAKE_CASE

  docker:
    compose:
      # compose.yaml'daki servisler uygulama kapaninca durmasin
      lifecycle-management: start-only
      start:
        # Bazi servisler zaten calisiyor olsa da "up" calissin: eksik olanlari (orn. laravel
        # profilindeki kopru ve proxy) baslatir, calisanlara dokunmaz
        skip: never

server:
  port: 8081
  # Reverse proxy'nin arkasinda: sayfalama linkleri istemcinin gordugu adresle uretilir
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

olive:
  # Mobil uygulama surumleri (version.json + APK); frontend'in yayinlama betigi buraya koyar
  releases-path: ${APP_RELEASES_PATH:releases}
