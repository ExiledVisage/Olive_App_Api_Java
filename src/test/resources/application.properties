spring.profiles.active=test
# Surum klasoru (AppReleaseScenarioIT her senaryoda bastan kurar)
olive.releases-path=target/test-releases
# Entegrasyon testleri yerel sahte sunucuya (http) baglanir
olive.integration.allow-http=true
olive.integration.secret=test-integration-secret
# Zamanlanmis entegrasyon senkronu testlerde kapali (testler elle tetikler)
olive.integration.schedule.enabled=false
