global:
  scrape_interval: 15s

scrape_configs:
  # Java uygulamasi (bilgisayarda calisirken). Konteynerde calisiyorsa hedef: api:8081
  - job_name: olive-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          application: olive-api
